



- name: Deploy static website to S3
  amazon.aws.s3_object:
    bucket: "{{ aws_s3_bucket }}"
    object:  "{{ website_content_dir }}/{{ item | basename }}" 
    src: "{{ item }}"
    mode: put
    acl: public-read
  with_fileglob:
    - "{{ role_path }}/files/*"
  loop_control:
    label: "{{ item | basename }}"
