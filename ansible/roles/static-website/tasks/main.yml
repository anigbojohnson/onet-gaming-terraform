



- name: Deploy static website to S3
  amazon.aws.s3_object:
    bucket: "{{ s3_bucket_name }}"
    object:  "{{ website_content_dir }}/{{ item | basename }}" 
    src: "{{ item }}"
    mode: put
    acl: public-read
  with_fileglob:
    - "{{ role_path }}/files/*"
  loop_control:
    label: "{{ item | basename }}"
