---
- name: Ensure app directory exists
  file:
    path: /opt/server
    state: directory
    owner: root
    group: root
    mode: '0755'


- name: Generate .env file for app
  template:
    src: templates/.env.j2
    dest: /opt/server/.env
    mode: '0600'


- name: Archive Node.js app
  archive:
    path: ./server
    dest: "{{ role_path }}/files/server.tar.gz"   # put archive in role's files folder

- name: Copy archive to server
  copy:
    src: "{{ role_path }}/files/server.tar.gz"    # copy from role's files folder
    dest: /tmp/server.tar.gz

- name: Extract app on server
  unarchive:
    src: /tmp/server.tar.gz
    dest: /opt/
    remote_src: yes



    
  notify:
    - Restart Node.js App  