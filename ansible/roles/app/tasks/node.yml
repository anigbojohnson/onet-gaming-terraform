- name: Add NodeSource GPG key
  ansible.builtin.apt_key:
    url: https://deb.nodesource.com/gpgkey/nodesource.gpg.key
    state: present

- name: Add NodeSource Node.js repository
  ansible.builtin.apt_repository:
    repo: "deb https://deb.nodesource.com/node_18.x {{ ansible_distribution_release }} main"
    state: present

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install Node.js and npm
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present

- name: Check Node.js version
  ansible.builtin.command: node -v
  register: node_version

- name: Show Node.js version
  ansible.builtin.debug:
    msg: "{{ node_version.stdout }}"

- name: Check npm version
  ansible.builtin.command: npm -v
  register: npm_version

- name: Show npm version
  ansible.builtin.debug:
    msg: "{{ npm_version.stdout }}"

- name: Create node user if not exists
  ansible.builtin.user:
    name: node
    system: yes
    create_home: no
    shell: /usr/sbin/nologin

- name: Create systemd service for Node.js app
  ansible.builtin.copy:
    dest: /etc/systemd/system/myapp.service
    content: |
      [Unit]
      Description=My Node.js App
      After=network.target

      [Service]
      ExecStart=/usr/bin/node /opt/server/app.js
      Restart=always
      User=node
      Group=node
      Environment=PATH=/usr/bin:/usr/local/bin
      WorkingDirectory=/opt/server

      [Install]
      WantedBy=multi-user.target
