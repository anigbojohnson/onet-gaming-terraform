---
# tasks file for todo_role (Ubuntu)

- name: Import MySQL GPG key
  apt_key:
    url: https://repo.mysql.com/RPM-GPG-KEY-mysql-2022
    state: present

- name: Add MySQL APT repository
  apt_repository:
    repo: "deb http://repo.mysql.com/apt/ubuntu {{ ansible_distribution_release }} mysql-apt-config"
    state: present
    filename: mysql

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install MySQL server
  apt:
    name: mysql-server
    state: present

- name: Start and enable MySQL service
  systemd:
    name: mysql
    state: started
    enabled: yes

- name: Install pip for Python 3
  apt:
    name: python3-pip
    state: present

- name: Install PyMySQL via pip
  pip:
    name: PyMySQL
    executable: pip3

- name: Ensure database exists
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_host: "{{ db_host }}"
    login_port: "{{ db_port }}"
    login_user: "{{ db_user }}"
    login_password: "{{ db_password }}"
    login_db: mysql

- name: Create tasks table
  community.mysql.mysql_query:
    query: |
      CREATE TABLE IF NOT EXISTS tasks (
        id INT AUTO_INCREMENT PRIMARY KEY,
        title VARCHAR(255) NOT NULL,
        status TINYINT(1) DEFAULT 0,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
    login_host: "{{ db_host }}"
    login_port: "{{ db_port }}"
    login_user: "{{ db_user }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
