---
# tasks file for todo_role (Ubuntu, modern key handling)

- name: Ensure prerequisites are installed
  apt:
    name: 
      - gnupg
      - python3-pip
    state: present
    update_cache: yes

- name: Download MySQL APT GPG key
  ansible.builtin.get_url:
    url: https://repo.mysql.com/RPM-GPG-KEY-mysql-2022
    dest: /usr/share/keyrings/mysql.gpg
    mode: '0644'
  register: mysql_gpg_key

- name: Add MySQL APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/mysql.gpg] http://repo.mysql.com/apt/ubuntu {{ ansible_distribution_release | lower }} mysql-apt-config"
    state: present
    filename: mysql
  when: mysql_gpg_key is succeeded

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install MySQL server
  ansible.builtin.apt:
    name: mysql-server
    state: present

- name: Start and enable MySQL service
  ansible.builtin.systemd:
    name: mysql
    state: started
    enabled: yes

- name: Install PyMySQL via pip
  ansible.builtin.pip:
    name: PyMySQL
    executable: pip3

- name: Ensure database exists
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_host: "{{ db_host }}"
    login_port: "{{ db_port }}"
    login_user: "{{ db_user }}"
    login_password: "{{ db_password }}"
    login_db: mysql

- name: Create tasks table
  community.mysql.mysql_query:
    query: |
      CREATE TABLE IF NOT EXISTS tasks (
        id INT AUTO_INCREMENT PRIMARY KEY,
        title VARCHAR(255) NOT NULL,
        status TINYINT(1) DEFAULT 0,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
    login_host: "{{ db_host }}"
    login_port: "{{ db_port }}"
    login_user: "{{ db_user }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
