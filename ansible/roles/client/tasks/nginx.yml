---
- name: Enable Nginx extras repo on Amazon Linux 2
  command: amazon-linux-extras enable nginx1
  register: nginx_repo
  changed_when: "'enabled' in nginx_repo.stdout"

- name: Refresh yum metadata after enabling nginx1
  command: yum clean metadata
  when: "'enabled' in nginx_repo.stdout"

- name: Install Nginx
  yum:
    name: nginx
    state: present
    update_cache: yes   # makes sure new repo is picked up

- name: Enable and start Nginx service
  service:
    name: nginx
    state: started
    enabled: yes

- name: Copy Nginx configuration
  copy:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx
