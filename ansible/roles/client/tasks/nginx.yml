---
- name: Refresh yum metadata
  ansible.builtin.command: yum makecache
  become: yes
  changed_when: true

- name: Install Nginx
  ansible.builtin.yum:
    name: nginx
    state: present
  become: yes

- name: Enable and start Nginx service
  service:
    name: nginx
    state: started
    enabled: yes

- name: Copy Nginx configuration
  copy:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

