---
# roles/client/tasks/main.yml

- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist

- name: Ensure Python 3 and pip are installed
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
    state: present

- name: Show Python version used by Ansible
  command: "{{ ansible_python_interpreter }} --version"
  register: python_version_output

- name: Display Python version
  debug:
    msg: "{{ python_version_output.stdout }}"

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Enable and start Nginx service
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: Copy Nginx configuration
  ansible.builtin.copy:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx
